server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_SEARCH_LOCATIONS:file:/config-repo,file:./config-repo,file:../config-repo}
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/noiseandsmke/flash-sale-config.git}
          default-label: ${CONFIG_GIT_DEFAULT_LABEL:main}
          clone-on-start: ${CONFIG_GIT_CLONE_ON_START:true}
          timeout: ${CONFIG_GIT_TIMEOUT:5}
          skip-ssl-validation: ${CONFIG_GIT_SKIP_SSL:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

