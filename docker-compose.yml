name: flashsale

networks:
  flashsale-network:
    name: flashsale-network
    driver: bridge

volumes:
  order_postgres_data:
    name: flashsale-order-postgres-data
    driver: local
  payment_postgres_data:
    name: flashsale-payment-postgres-data
    driver: local
  redis_data:
    name: flashsale-redis-data
    driver: local
  kafka_data:
    name: flashsale-kafka-data
    driver: local

services:
  postgres-order:
    image: postgres:18-alpine
    container_name: flashsale-postgres-order
    networks:
      - flashsale-network
    environment:
      POSTGRES_DB: flashsale_order_db
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: admin_secure_password
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres_admin -d flashsale_order_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-payment:
    image: postgres:18-alpine
    container_name: flashsale-postgres-payment
    networks:
      - flashsale-network
    environment:
      POSTGRES_DB: flashsale_payment_db
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: admin_secure_password
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres_admin -d flashsale_payment_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.10-alpine
    container_name: flashsale-redis
    networks:
      - flashsale-network
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "redis_secure_password" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redis_secure_password", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.0
    container_name: flashsale-kafka
    networks:
      - flashsale-network
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: flashsale-config-server
    networks:
      - flashsale-network
    ports:
      - "8888:8888"
    environment:
      CONFIG_GIT_URI: ${CONFIG_GIT_URI:-https://github.com/noiseandsmke/flash-sale-config.git}
      CONFIG_GIT_DEFAULT_LABEL: ${CONFIG_GIT_DEFAULT_LABEL:-main}
      CONFIG_GIT_USERNAME: ${CONFIG_GIT_USERNAME:-}
      CONFIG_GIT_PASSWORD: ${CONFIG_GIT_PASSWORD:-}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep UP || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  reservation-service:
    build:
      context: ./reservation-service
      dockerfile: Dockerfile
    container_name: flashsale-reservation-service
    networks:
      - flashsale-network
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_HOST: config-server
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_secure_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: flashsale-order-service
    networks:
      - flashsale-network
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_HOST: config-server
      POSTGRES_HOST: postgres-order
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: admin_secure_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      config-server:
        condition: service_healthy
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep UP || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: flashsale-payment-service
    networks:
      - flashsale-network
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_HOST: config-server
      POSTGRES_HOST: postgres-payment
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: admin_secure_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      config-server:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep UP || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped